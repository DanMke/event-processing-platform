name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags=integration -v ./internal/repository/postgres/... ./internal/sender/...

      - name: Build binaries
        run: |
          go build -o /tmp/processor ./cmd/processor
          go build -o /tmp/producer ./cmd/producer
          go build -o /tmp/loadgen ./cmd/loadgen
          go build -o /tmp/sender ./cmd/sender
