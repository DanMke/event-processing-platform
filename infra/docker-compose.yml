services:
  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events"]
      interval: 5s
      timeout: 5s
      retries: 10

  processor:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BINARY: processor
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: raw-events
      KAFKA_GROUP_ID: event-processor
      KAFKA_DLQ_TOPIC: failed-events
      KAFKA_WORKERS: ${KAFKA_WORKERS:-4}
      POSTGRES_DSN: postgres://events:events@postgres:5432/events?sslmode=disable
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-20}
      METRICS_PORT: "2112"
      LOG_FORMAT: json
    expose:
      - "2112"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  loadgen:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BINARY: loadgen
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: raw-events
      TOTAL_EVENTS: ${TOTAL_EVENTS:-1000}
      TENANTS: ${TENANTS:-5}
      INVALID_RATIO: ${INVALID_RATIO:-0.05}
      DUPLICATE_RATIO: ${DUPLICATE_RATIO:-0.02}
      CONCURRENCY: ${CONCURRENCY:-4}
      LOG_FORMAT: json
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - loadgen

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - processor

volumes:
  kafka_data:
  postgres_data:
  prometheus_data:
