global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "processor"
    scrape_interval: 5s
    dns_sd_configs:
      - names:
          - "processor"
        type: A
        port: 2112

  - job_name: "kafka"
    scrape_interval: 10s
    static_configs:
      - targets: ["kafka-exporter:9308"]